<!DOCTYPE html>
<html lang="en">
<head>

<title>Akasa Air - Passenger Details</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; color: #222; }

  /* ── NAVBAR (visual parity with akasaair.com) ── */
  .navbar {
    background: #fff; border-bottom: 1px solid #eee;
    padding: 14px 28px; display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; flex-direction: column; line-height: 1.1; }
  .brand-name { font-size: 20px; font-weight: 800; color: #5c0fd9; }
  .brand-tag  { font-size: 9px; font-weight: 700; color: #e8630a; letter-spacing: 0.5px; }
  .nav-links  { display: none; }
  @media (min-width: 900px) {
    .nav-links { display: flex; gap: 26px; font-size: 14px; color: #333; }
  }

  /* ── PAGE HEADER ── */
  .page-header {
    background: #fff; padding: 22px 24px 18px; border-bottom: 1px solid #eee;
  }
  .page-title { font-size: 24px; font-weight: 800; color: #1a1a2e; }
  .page-subtitle { font-size: 13px; color: #888; margin-top: 4px; }

  /* ── SECTOR SUMMARY STRIP ── */
  .trip-strip {
    background: #fff8f2; border-bottom: 1px solid #fcd6b0;
    padding: 10px 24px; font-size: 12.5px; color: #c05000; font-weight: 600;
    display: none;
  }

  /* ── PASSENGER LIST ── */
  .main { max-width: 900px; margin: 0 auto; padding: 18px 20px 140px; }
  .pax-item {
    background: #fff8f2; border: 1.5px solid #fcd9b6; border-radius: 10px;
    margin-bottom: 14px; overflow: hidden; transition: border-color 0.15s;
  }
  .pax-item.done { border-color: #22a06b; }
  .pax-item.invalid { border-color: #d94b3d; }

  .pax-item-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 18px; cursor: pointer;
  }
  .pax-item-left { display: flex; align-items: center; gap: 12px; }
  .pax-icon {
    width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid #e8630a;
    display: flex; align-items: center; justify-content: center; color: #e8630a; font-size: 17px;
    flex-shrink: 0;
  }
  .pax-item.done .pax-icon { border-color: #22a06b; color: #22a06b; }
  .pax-title { font-size: 16px; font-weight: 700; color: #1a1a2e; }
  .pax-subtitle { font-size: 12px; color: #888; margin-top: 2px; }

  .pax-item-right { display: flex; align-items: center; gap: 18px; }
  .chevron { font-size: 13px; color: #888; transition: transform 0.15s; }
  .pax-item.expanded .chevron { transform: rotate(180deg); }

  /* ── FORM BODY ── */
  .pax-body {
    max-height: 0; overflow: hidden; transition: max-height 0.2s ease;
    background: #fff;
  }
  .pax-item.expanded .pax-body { max-height: 600px; }
  .pax-body-inner { padding: 4px 18px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .pax-body-inner { grid-template-columns: 1fr; } }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 12px; font-weight: 700; color: #555; }
  .field input, .field select {
    border: 1.5px solid #ddd; border-radius: 6px; padding: 10px 12px; font-size: 14px;
    color: #222; background: #fff; outline: none; transition: border-color 0.15s;
  }
  .field input:focus, .field select:focus { border-color: #e8630a; }
  .field input.err, .field select.err { border-color: #d94b3d; }
  .field .hint { font-size: 10.5px; color: #999; }
  .field .error-message {
    display: none;
    font-size: 11px;
    color: #d94b3d;
    line-height: 1.35;
  }
  .field.has-error .error-message { display: block; }
  .field.has-error input,
  .field.has-error select { border-color: #d94b3d; }

  .gender-pick { display: flex; gap: 10px; }
  .gender-opt {
    flex: 1; border: 1.5px solid #ddd; border-radius: 6px; padding: 9px; text-align: center;
    font-size: 13px; font-weight: 600; color: #555; cursor: pointer; transition: 0.15s;
  }
  .gender-opt.sel { border-color: #e8630a; background: #fff3ec; color: #c05000; }

  /* ── BOTTOM BAR ── */
  .bottom-bar {
    background: #fff; border-top: 2px solid #e5e7eb;
    padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  }
  .price-info { display: flex; flex-direction: column; gap: 2px; }
  .price-total { font-size: 20px; font-weight: 800; color: #e8630a; }
  .price-link  { font-size: 11px; color: #888; cursor: pointer; text-decoration: underline; }
  .btn-continue {
    border: none; padding: 13px 34px; border-radius: 6px; font-size: 15px; font-weight: 700;
    cursor: pointer; background: #e8630a; color: #fff; transition: background 0.15s;
  }
  .btn-continue:hover { background: #c95500; }
  .btn-continue:disabled { background: #f0b98a; cursor: not-allowed; }

  #loading, #error-box { text-align: center; padding: 40px 24px; color: #888; font-size: 14px; }
  #error-box { display: none; color: #333; }
  #error-box strong { color: #d94b3d; display: block; margin-bottom: 8px; font-size: 15px; }
</style>

  // exact order the backend expects them back (matches passengerKeys order
  // from /create-trip). Each entry:
  //   { key: "<passengerKey>", type: "ADT"|"SNR"|"CHD"|"INF", label: "Adult 1" }
  // Falls back to building a generic list from adult/senior/child/infant
  // counts if passenger_meta isn't supplied (useful for local testing).
  let paxMeta = [];

  function getQueryParam(name) {
    return new URLSearchParams(window.location.search).get(name) || '';
  }

  function buildFallbackPaxMeta() {
    const adults = parseInt(getQueryParam('adult_count') || '1', 10) || 0;
    const seniors = parseInt(getQueryParam('senior_count') || '0', 10) || 0;
    const children = parseInt(getQueryParam('child_count') || '0', 10) || 0;
    const infants = parseInt(getQueryParam('infant_count') || '0', 10) || 0;
    const meta = [];
    for (let i = 1; i <= adults; i++) meta.push({ key: `ADT_${i}`, type: 'ADT', label: `Adult ${i}` });
    for (let i = 1; i <= seniors; i++) meta.push({ key: `SNR_${i}`, type: 'SNR', label: `Senior Citizen ${i}` });
    for (let i = 1; i <= children; i++) meta.push({ key: `CHD_${i}`, type: 'CHD', label: `Child ${i}` });
    for (let i = 1; i <= infants; i++) meta.push({ key: `INF_${i}`, type: 'INF', label: `Infant ${i}` });
    return meta;
  }

  function init() {
    baseUrl = getQueryParam('base_url');
    authToken = getQueryParam('auth_token');
    qpApiKey = getQueryParam('qp_bot_api_key');
    qpSource = getQueryParam('qp_bot_source') || 'CHATBOTWEB';
    customerNumber = getQueryParam('customer_number');
    tripSummary = getQueryParam('trip_summary') || '';
    const amountStr = getQueryParam('total_amount');
    totalAmount = amountStr ? parseFloat(amountStr) : 0;
    currencyCode = getQueryParam('currency') || 'INR';

    try {
      const rawMeta = getQueryParam('passenger_meta');
      paxMeta = rawMeta ? JSON.parse(rawMeta) : [];
    } catch (e) {
      paxMeta = [];
    }
    if (!Array.isArray(paxMeta) || paxMeta.length === 0) {
      paxMeta = buildFallbackPaxMeta();
    }

    document.getElementById('loading').style.display = 'none';

    if (tripSummary) {
      const strip = document.getElementById('trip-strip');
      strip.textContent = tripSummary;
      strip.style.display = 'block';
    }

    renderPassengers();
    updatePriceBar();

    document.getElementById('main-root').style.display = 'block';
    document.getElementById('bottom-bar').style.display = 'flex';
  }

  // ---------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------
  function renderPassengers() {
    const list = document.getElementById('pax-list');
    list.innerHTML = '';

    paxMeta.forEach((pax, idx) => {
      const item = document.createElement('div');
      item.className = 'pax-item';
      item.id = `pax-item-${idx}`;

      const adultOptions = paxMeta
        .map((p, i) => ({ ...p, i }))
        .filter(p => p.type === 'ADT' || p.type === 'SNR');

      item.innerHTML = `
        <div class="pax-item-head" onclick="togglePax(${idx})">
          <div class="pax-item-left">
            <div class="pax-icon">👤</div>
            <div>
              <div class="pax-title">${pax.label || (TYPE_LABELS[pax.type] || 'Passenger') + ' ' + (idx + 1)}</div>
              <div class="pax-subtitle" id="pax-subtitle-${idx}">Tap to add details</div>
            </div>
          </div>
          <div class="pax-item-right">
            <div class="chevron">▾</div>
          </div>
        </div>
        <div class="pax-body">
          <div class="pax-body-inner">
            <div class="field" id="pax-fn-field-${idx}">
              <label>First Name*</label>
              <input
                type="text"
                id="pax-fn-${idx}"
                placeholder="First name"
                maxlength="50"
                autocomplete="given-name"
                oninput="markDirty(${idx})"
              >
              <div class="error-message" id="pax-fn-error-${idx}"></div>
            </div>
            <div class="field" id="pax-ln-field-${idx}">
              <label>Last Name*</label>
              <input
                type="text"
                id="pax-ln-${idx}"
                placeholder="Last name"
                maxlength="50"
                autocomplete="family-name"
                oninput="markDirty(${idx})"
              >
              <div class="error-message" id="pax-ln-error-${idx}"></div>
            </div>
            <div class="field full">
              <label>Gender*</label>
              <div class="gender-pick" id="pax-gender-${idx}">
                <div class="gender-opt" data-val="M" onclick="pickGender(${idx}, 'M')">Male</div>
                <div class="gender-opt" data-val="F" onclick="pickGender(${idx}, 'F')">Female</div>
              </div>
            </div>
            <div class="field" id="pax-dob-field-${idx}">
              <label>Date of Birth*</label>
              <input
                type="date"
                id="pax-dob-${idx}"
                max=""
                autocomplete="bday"
                oninput="markDirty(${idx})"
              >
              <div class="error-message" id="pax-dob-error-${idx}"></div>
            </div>
            <div class="field">
              <label>Nationality</label>
              <select id="pax-nat-${idx}" onchange="markDirty(${idx})">
                ${COUNTRIES.map(country => `
                  <option value="${country.code}" ${country.code === 'IN' ? 'selected' : ''}>
                    ${country.name} (${country.code})
                  </option>
                `).join('')}
              </select>
            </div>
            ${pax.type === 'INF' ? `
            <div class="field full">
              <label>Travelling with*</label>
              <select id="pax-attach-${idx}" onchange="markDirty(${idx})">
                <option value="">Select accompanying adult/senior</option>
                ${adultOptions.map(a => `<option value="${a.key}">${a.label || (TYPE_LABELS[a.type] + ' ' + (a.i + 1))}</option>`).join('')}
              </select>
            </div>` : ''}
          </div>
        </div>
      `;
      list.appendChild(item);
    });

    // Prevent selecting a future date of birth.
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    const maxDob = `${yyyy}-${mm}-${dd}`;

    paxMeta.forEach((_, idx) => {
      const dobInput = document.getElementById(`pax-dob-${idx}`);
      if (dobInput) dobInput.max = maxDob;
    });

    // Expand the first passenger by default.
    if (paxMeta.length > 0) togglePax(0, true);
  }

  function togglePax(idx, forceOpen) {
    const item = document.getElementById(`pax-item-${idx}`);
    if (!item) return;
    const isOpen = item.classList.contains('expanded');
    document.querySelectorAll('.pax-item').forEach(el => el.classList.remove('expanded'));
    if (forceOpen || !isOpen) item.classList.add('expanded');
  }

  function pickGender(idx, val) {
    const wrap = document.getElementById(`pax-gender-${idx}`);
    wrap.querySelectorAll('.gender-opt').forEach(el => el.classList.toggle('sel', el.dataset.val === val));
    wrap.dataset.value = val;
    markDirty(idx);
  }

  // ---------------------------------------------------------
  // Field + passenger validation
  // ---------------------------------------------------------

  // Passenger age rules:
  // ADT = 12 years or older and below 60
  // SNR = 60 years or older
  // CHD = 2 years or older and below 12
  // INF = below 2 years
  //
  // Note: At exactly 2 years, the passenger is treated as CHD.
  // At exactly 12 years, the passenger is treated as ADT.
  // Age is calculated as of today's date (the booking date).
  function calculateAge(dobString) {
    if (!dobString) return null;

    const dob = new Date(`${dobString}T00:00:00`);
    if (Number.isNaN(dob.getTime())) return null;

    const today = new Date();
    const todayOnly = new Date(
      today.getFullYear(),
      today.getMonth(),
      today.getDate()
    );

    if (dob > todayOnly) return null;

    let age = todayOnly.getFullYear() - dob.getFullYear();

    const birthdayPassed =
      todayOnly.getMonth() > dob.getMonth() ||
      (
        todayOnly.getMonth() === dob.getMonth() &&
        todayOnly.getDate() >= dob.getDate()
      );

    if (!birthdayPassed) age--;

    return age;
  }

  function getAgeRuleMessage(type, age) {
    switch (type) {
      case 'ADT':
        return age === null
          ? 'Please enter a valid date of birth.'
          : age < 12 || age >= 60
            ? 'Adult passenger must be 12 years or older and below 60 years.'
            : '';
      case 'SNR':
        return age === null
          ? 'Please enter a valid date of birth.'
          : age < 60
            ? 'Senior Citizen passenger must be 60 years or older.'
            : '';
      case 'CHD':
        return age === null
          ? 'Please enter a valid date of birth.'
          : (age < 2 || age >= 12)
            ? 'Child passenger must be 2 years or older and below 12 years.'
            : '';
      case 'INF':
        return age === null
          ? 'Please enter a valid date of birth.'
          : age >= 2
            ? 'Infant passenger must be below 2 years old.'
            : '';
      default:
        return '';
    }
  }

  // Allows normal passport/airline names such as:
  // "Aarav", "Mary Jane", "O'Connor", "Anne-Marie".
  // Numbers are never allowed.
  function validateName(value, fieldLabel) {
    const name = (value || '').trim();

    if (!name) {
      return `${fieldLabel} is required.`;
    }

    if (name.length < 1 || name.length > 50) {
      return `${fieldLabel} must be between 1 and 50 characters.`;
    }

    if (/\d/.test(name)) {
      return `${fieldLabel} must not contain numbers.`;
    }

    // Unicode letters + spaces + apostrophe + hyphen.
    if (!/^[\p{L}]+(?:[ '\u2019-][\p{L}]+)*$/u.test(name)) {
      return `${fieldLabel} can contain letters, spaces, hyphens, and apostrophes only.`;
    }

    return '';
  }

  function setFieldError(fieldId, errorId, message) {
    const field = document.getElementById(fieldId);
    const error = document.getElementById(errorId);

    if (!field || !error) return;

    field.classList.toggle('has-error', Boolean(message));
    error.textContent = message || '';
  }

  function clearPassengerErrors(idx) {
    [
      [`pax-fn-field-${idx}`, `pax-fn-error-${idx}`],
      [`pax-ln-field-${idx}`, `pax-ln-error-${idx}`],
      [`pax-dob-field-${idx}`, `pax-dob-error-${idx}`]
    ].forEach(([fieldId, errorId]) => {
      setFieldError(fieldId, errorId, '');
    });

    document.getElementById(`pax-fn-${idx}`)?.classList.remove('err');
    document.getElementById(`pax-ln-${idx}`)?.classList.remove('err');
    document.getElementById(`pax-dob-${idx}`)?.classList.remove('err');
  }

  function validatePassenger(idx, pax, showErrors = true) {
    const fn = document.getElementById(`pax-fn-${idx}`)?.value.trim() || '';
    const ln = document.getElementById(`pax-ln-${idx}`)?.value.trim() || '';
    const dob = document.getElementById(`pax-dob-${idx}`)?.value || '';
    const gender = document.getElementById(`pax-gender-${idx}`)?.dataset.value || '';
    const attachTo = pax.type === 'INF'
      ? (document.getElementById(`pax-attach-${idx}`)?.value || '')
      : '';

    if (showErrors) clearPassengerErrors(idx);

    let valid = true;

    const fnError = validateName(fn, 'First name');
    if (fnError) {
      valid = false;
      if (showErrors) {
        setFieldError(`pax-fn-field-${idx}`, `pax-fn-error-${idx}`, fnError);
        document.getElementById(`pax-fn-${idx}`)?.classList.add('err');
      }
    }

    const lnError = validateName(ln, 'Last name');
    if (lnError) {
      valid = false;
      if (showErrors) {
        setFieldError(`pax-ln-field-${idx}`, `pax-ln-error-${idx}`, lnError);
        document.getElementById(`pax-ln-${idx}`)?.classList.add('err');
      }
    }

    if (!gender) {
      valid = false;
    }

    if (!dob) {
      valid = false;
      if (showErrors) {
        setFieldError(
          `pax-dob-field-${idx}`,
          `pax-dob-error-${idx}`,
          'Date of birth is required.'
        );
        document.getElementById(`pax-dob-${idx}`)?.classList.add('err');
      }
    } else {
      const age = calculateAge(dob);
      const dobError = getAgeRuleMessage(pax.type, age);

      if (dobError) {
        valid = false;
        if (showErrors) {
          setFieldError(
            `pax-dob-field-${idx}`,
            `pax-dob-error-${idx}`,
            dobError
          );
          document.getElementById(`pax-dob-${idx}`)?.classList.add('err');
        }
      }
    }

    if (pax.type === 'INF' && !attachTo) {
      valid = false;
    }

    return valid;
  }

  function markDirty(idx) {
    const item = document.getElementById(`pax-item-${idx}`);
    if (item) {
      item.classList.remove('invalid');
      item.classList.remove('done');
    }

    const pax = paxMeta[idx];
    if (pax) {
      // Validate live so the user immediately sees name/DOB errors,
      // but do not show required-field errors until Continue is pressed.
      validatePassenger(idx, pax, false);

      const fn = document.getElementById(`pax-fn-${idx}`)?.value.trim() || '';
      const ln = document.getElementById(`pax-ln-${idx}`)?.value.trim() || '';
      const dob = document.getElementById(`pax-dob-${idx}`)?.value || '';

      if (fn) {
        const err = validateName(fn, 'First name');
        setFieldError(
          `pax-fn-field-${idx}`,
          `pax-fn-error-${idx}`,
          err
        );
        document.getElementById(`pax-fn-${idx}`)?.classList.toggle('err', Boolean(err));
      } else {
        setFieldError(`pax-fn-field-${idx}`, `pax-fn-error-${idx}`, '');
      }

      if (ln) {
        const err = validateName(ln, 'Last name');
        setFieldError(
          `pax-ln-field-${idx}`,
          `pax-ln-error-${idx}`,
          err
        );
        document.getElementById(`pax-ln-${idx}`)?.classList.toggle('err', Boolean(err));
      } else {
        setFieldError(`pax-ln-field-${idx}`, `pax-ln-error-${idx}`, '');
      }

      if (dob) {
        const age = calculateAge(dob);
        const err = getAgeRuleMessage(pax.type, age);
        setFieldError(
          `pax-dob-field-${idx}`,
          `pax-dob-error-${idx}`,
          err
        );
        document.getElementById(`pax-dob-${idx}`)?.classList.toggle('err', Boolean(err));
      } else {
        setFieldError(`pax-dob-field-${idx}`, `pax-dob-error-${idx}`, '');
      }
    }

    updateSubtitle(idx);
  }

  function updateSubtitle(idx) {
    const fn = document.getElementById(`pax-fn-${idx}`)?.value.trim();
    const ln = document.getElementById(`pax-ln-${idx}`)?.value.trim();
    const sub = document.getElementById(`pax-subtitle-${idx}`);
    if (!sub) return;
    sub.textContent = (fn || ln) ? `${fn} ${ln}`.trim() : 'Tap to add details';
  }

  function updatePriceBar() {
    document.getElementById('price-display').textContent =
      `${currencyCode} ${totalAmount ? totalAmount.toLocaleString('en-IN') : '0'}`;
  }

  function toggleSummary() {
    if (tripSummary) {
      alert(`Trip Summary:\n${tripSummary}\n\nTotal: ${currencyCode} ${totalAmount.toLocaleString('en-IN')}`);
    } else {
      alert('No trip summary available.');
    }
  }

  // ---------------------------------------------------------
  // Validation + payload build
  // ---------------------------------------------------------
  function collectPassenger(idx, pax) {
    const gender = document.getElementById(`pax-gender-${idx}`)?.dataset.value || '';
    return {
      key: pax.key,
      type: pax.type,
      firstName: document.getElementById(`pax-fn-${idx}`)?.value.trim() || '',
      lastName: document.getElementById(`pax-ln-${idx}`)?.value.trim() || '',
      gender,
      dob: document.getElementById(`pax-dob-${idx}`)?.value || '',
      nationality: document.getElementById(`pax-nat-${idx}`)?.value.trim() || 'IN',
      attachTo: pax.type === 'INF' ? (document.getElementById(`pax-attach-${idx}`)?.value || '') : ''
    };
  }

  function validateAll() {
    let firstInvalidIdx = -1;

    const passengers = paxMeta.map((pax, idx) => {
      const p = collectPassenger(idx, pax);
      const isValid = validatePassenger(idx, pax, true);

      const item = document.getElementById(`pax-item-${idx}`);

      if (!isValid) {
        item.classList.add('invalid');
        item.classList.remove('done');

        if (firstInvalidIdx === -1) {
          firstInvalidIdx = idx;
        }
      } else {
        item.classList.remove('invalid');
        item.classList.add('done');
      }

      return p;
    });

    if (firstInvalidIdx !== -1) {
      togglePax(firstInvalidIdx, true);

      document
        .getElementById(`pax-item-${firstInvalidIdx}`)
        .scrollIntoView({ behavior: 'smooth', block: 'center' });

      return null;
    }

    return { passengers };
  }

  // Serializes to a compact "field|field|..." per passenger joined by ";;",
  // mirroring the delimiter scheme the seat-selection webview uses so the
  // bot side can parse it the same way.
  function buildPayloadString(data) {
    // Real ADT/SNR/CHD passengers keep the existing compact format.
    // Infants are intentionally NOT sent as normal passenger records because
    // Akasa may not allocate a separate passengerKey for an infant.
    const realPassengerPart = data.passengers
      .filter(p => p.type !== 'INF' && !String(p.key || '').startsWith('__INFANT_'))
      .map(p => [
        p.key,
        p.type,
        p.firstName,
        p.lastName,
        p.gender,
        p.dob,
        p.nationality,
        p.attachTo
      ].join('|'))
      .join(';;');

    const infants = data.passengers
      .filter(p => p.type === 'INF')
      .map(p => ({
        syntheticKey: p.key,
        firstName: p.firstName,
        lastName: p.lastName,
        gender: p.gender,
        dateOfBirth: p.dob,
        nationality: p.nationality || 'IN',
        attachTo: p.attachTo
      }));

    let payload = `passengers=${realPassengerPart}`;

    if (infants.length) {
      // URL-safe Base64 keeps infant JSON out of the pipe/double-semicolon
      // delimiter used for normal passenger records.
      const json = JSON.stringify(infants);
      const bytes = new TextEncoder().encode(json);
      let binary = '';
      bytes.forEach(b => binary += String.fromCharCode(b));
      const encoded = btoa(binary)
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/g, '');

      payload += `;;INFANTS_B64=${encoded}`;
    }

    return payload;
  }

  function sendPassengerDetailsToBot(payload) {
    // Haptik expects ONE URL-encoded `message` query parameter.
    // Do not pre-encode the payload separately: doing so can leave the bot
    // with a callback it cannot parse and makes the passenger card reopen.
    const message =
      `Passengers are successfully added. {Capture ${payload} in capture_passenger_details_payload and execute function book_a_new_flight}`;

    const callbackUrl =
      `http://haptik-webview//perform-action?action=close` +
      `&message=${encodeURIComponent(message)}` +
      `&message_type=0`;

    console.log("Haptik passenger callback:", message);

    // Web SDK: send the close URL to the parent frame.
    if (window.parent && window.parent !== window) {
      window.parent.postMessage(callbackUrl, "*");
      return;
    }

    // Native/fallback: navigate to the haptik-webview URL.
    window.location.href = callbackUrl;
  }

  function handleContinue() {
    const data = validateAll();
    if (!data) return;

    const btn = document.getElementById('continue-btn');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    const payload = buildPayloadString(data);
    setTimeout(() => sendPassengerDetailsToBot(payload), 400);
  }

  init();
</script>
</body>
</html>
